name: app-build-android-dev
on:
  workflow_dispatch:
  push:
    tags:
      - "dev_v*"
jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 签出代码，master分支
      - uses: actions/checkout@v4

      # APK签名：base64密钥还原
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      # 生成android key.properties签名配置
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      # JDK17
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # Flutter环境
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 预写入Android License，解决SDK许可卡死问题
      - name: Pre accept Android SDK licenses
        run: |
          mkdir -p ${ANDROID_HOME}/licenses
          echo "24333f8a63b6825ea9c551483c82fa59b6ef137c" > ${ANDROID_HOME}/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c9146dabd14" > ${ANDROID_HOME}/licenses/android-sdk-preview-license

      # 拉取依赖
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 编译APK，按架构拆分
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 上传3个架构APK到制品
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - run: echo "✅ Android build finished, status: ${{ job.status }}."
