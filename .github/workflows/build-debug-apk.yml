name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply Huya patch
        run: |
          unzip -o huya_fix_cloud_build_patch_v2.zip -d .
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Inspect auto_orientation_v2 Gradle file
        working-directory: simple_live_app
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/auto_orientation_v2-2.4.7/android/build.gradle"
          echo "Inspecting: $FILE"
          nl -ba "$FILE" | sed -n '45,65p'

      - name: Build APK
        working-directory: simple_live_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dart-simple-live-debug-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
